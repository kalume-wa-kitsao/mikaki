<div class="mikaki-page">
    <div class="mikaki-page-header">
        <span class="mikaki-white-header">
            LET'S WORK
        </span>
        <span class="mikaki-gray-header">
            TOGETHER
        </span>
    </div>

    <div class="mikaki-page-content">

        <form [formGroup]="contactForm" (ngSubmit)="onFormSubmit()" class="mikaki-contact-form">
            <div class="mikaki-form-row">
                <div class="mikaki-form-group">
                    <label for="name">
                        Name
                    </label>
                    <input id="name" type="text" formControlName="name" placeholder="Your Name" />
                    <div class="error" *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
                        Name is required!
                    </div>
                </div>

                <div class="mikaki-form-group">
                    <label for="email">
                        Email
                    </label>
                    <input id="email" type="text" formControlName="email" placeholder="Your@email.com" />
                    <div class="error" *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
                        Enter a valid email.
                    </div>
                </div>
            </div>

            <div class="mikaki-form-group">
                <label for="subject">
                    Subject
                </label>
                <input id="subject" type="text" formControlName="subject" placeholder="Subject here..." />
            </div>

            <div class="mikaki-form-group">
                <label for="message">
                    Message
                </label>
                <textarea id="message" formControlName="message" placeholder="Your Message"></textarea>
                <div class="error" *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched">
                    Message is required
                </div>
            </div>

            <div style="margin-top: 12px;">
                <button type="submit" [disabled]="contactForm.invalid">Send Message</button>
            </div>
        </form>

    </div>
</div>
